name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (trains a model from scratch, then tests data, model, SHAP and API)
        run: pytest -q
      - name: Full training run
        run: PYTHONPATH=src python -m dropout.train --no-figures

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dropout-api .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api dropout-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep '"status":"ok"'
